<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 桃源東京與河口湖六日遊</title>
<style>
  :root {
    --bg-color: #FFFCF6;
    --border-color: #3E3A39;
    --card-bg: #FFFFFF;
    --coral: #F2A497;
    --yellow: #F6D27A;
    --blue: #A8D3E6;
    --green: #B9DAA5;
    --gray-bg: #F8F6F0;
  }
  
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--border-color);
    margin: 0;
    padding: 12px;
    line-height: 1.6;
    padding-bottom: 70px;
  }
  
  .header {
    background-color: var(--yellow);
    border: 3px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 4px 4px 0px var(--border-color);
    text-align: center;
  }
  .header h1 { margin: 0 0 6px 0; font-size: 1.3rem; }
  .header p { margin: 0 0 10px 0; font-size: 0.85rem; color: #555; }
  
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: bold;
    margin: 2px;
  }
  .tag-coral { background-color: var(--coral); }
  .tag-blue { background-color: var(--blue); }
  .tag-green { background-color: var(--green); }
  
  .tab-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    font-size: 0.88rem;
    font-weight: bold;
    border: 3px solid var(--border-color);
    border-radius: 12px;
    background-color: #FFFFFF;
    color: var(--border-color);
    box-shadow: 3px 3px 0px var(--border-color);
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background-color: var(--coral);
    box-shadow: none;
    transform: translate(3px, 3px);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  .card {
    background-color: var(--card-bg);
    border: 3px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 4px 4px 0px var(--border-color);
  }
  
  .day-title {
    font-size: 1.05rem;
    font-weight: bold;
    border-bottom: 2px dashed var(--border-color);
    padding-bottom: 6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .timeline-item { margin-bottom: 10px; }
  .time { font-weight: bold; color: #D35400; font-size: 0.88rem; }
  
  .checklist-group-title {
    font-size: 0.98rem;
    font-weight: bold;
    background-color: var(--blue);
    border: 2px solid var(--border-color);
    padding: 4px 10px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: inline-block;
  }

  .checklist-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1.5px dashed #E0E0E0;
    font-size: 0.9rem;
  }
  .checklist-item input[type="checkbox"] {
    margin-right: 10px;
    transform: scale(1.3);
    accent-color: #D35400;
  }
  .checklist-item.done span,
  .checklist-item.done input[type="text"] {
    text-decoration: line-through;
    color: #888888;
  }

  .custom-input {
    border: none;
    border-bottom: 2px solid var(--border-color);
    background: transparent;
    font-size: 0.9rem;
    font-family: inherit;
    width: 100%;
    outline: none;
  }

  .add-item-btn {
    margin-top: 10px;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: bold;
    background-color: var(--yellow);
    border: 2px solid var(--border-color);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 2px 2px 0px var(--border-color);
  }
  
  .loading-status {
    text-align: center;
    padding: 10px;
    font-size: 0.85rem;
    color: #666;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>🌸 桃源東京與河口湖六日遊</h1>
    <p id="sync-time-text">雲端同步中...</p>
    <div>
      <span class="tag tag-coral">📅 11/06 - 11/11</span>
      <span class="tag tag-blue">👥 4人同行</span>
      <span class="tag tag-green">🏨 錦糸町 + 河口湖溫泉</span>
    </div>
  </div>

  <!-- 分頁按鈕 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('itinerary')">🗓️ 每日行程</button>
    <button class="tab-btn" onclick="switchTab('checklist')">📋 行前代辦</button>
    <button class="tab-btn" onclick="switchTab('packing')">🧳 行李清單</button>
  </div>

  <!-- TAB 1: 每日行程（由 Google 試算表動態生成） -->
  <div id="tab-itinerary" class="tab-content active">
    <div id="itinerary-container">
      <div class="card loading-status">🔄 正在載入 Google 試算表最新行程...</div>
    </div>
  </div>

  <!-- TAB 2: 行前代辦 -->
  <div id="tab-checklist" class="tab-content">
    <div class="card">
      <div class="checklist-group-title">🎫 門票與預訂狀態</div>
      <div class="checklist-item done" onclick="toggleDone(this, event)">
        <input type="checkbox" checked>
        <div><span><strong>SHIBUYA SKY 門票</strong>（11/7 16:00 入場，¥3,400/人）</span></div>
      </div>
      <div class="checklist-item done" onclick="toggleDone(this, event)">
        <input type="checkbox" checked>
        <div><span><strong>JR 富士回遊特急車票</strong>（11/9 07:07 錦糸町➔河口湖，右側AB席，¥17,560）</span></div>
      </div>
      <div class="checklist-item done" onclick="toggleDone(this, event)">
        <input type="checkbox" checked>
        <div><span><strong>日光一日遊預訂</strong>（11/8 08:00 東京車站集合，共 $6,787）</span></div>
      </div>
    </div>
  </div>

  <!-- TAB 3: 行李清單 -->
  <div id="tab-packing" class="tab-content">
    <div class="card">
      <div class="checklist-group-title">📄 隨身證件與財物</div>
      <div class="checklist-item" onclick="toggleDone(this, event)">
        <input type="checkbox"><div><span>護照正本、台灣駕照正本 + 日文譯本</span></div>
      </div>
      <div class="checklist-item" onclick="toggleDone(this, event)">
        <input type="checkbox"><div><span>日圓現金、信用卡、Suica / PASMO 交通卡</span></div>
      </div>
    </div>

    <div class="card">
      <div class="checklist-group-title" style="background-color: var(--yellow);">✏️ 自訂個人補充清單（可隨時編輯）</div>
      <div id="custom-packing-container">
        <div class="checklist-item" onclick="toggleDone(this, event)">
          <input type="checkbox">
          <div style="flex:1;"><input type="text" class="custom-input" placeholder="點擊填寫新增物品..." onclick="event.stopPropagation()"></div>
        </div>
      </div>
      <button class="add-item-btn" onclick="addCustomItem()">➕ 新增空白項目</button>
    </div>
  </div>

  <script>
    // ⚠️ 請將下方的網址替換為您在 Google 試算表發布的 CSV 連結 ⚠️
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5cl0ISmWZqJbgbj8jg7JruKf1_b7MYTuXnkoyfbxwcCSaqHo6LzzoNtQPoF6va-zDDXdsCqGzFZ8q/pub?gid=0&single=true&output=csv';

    async function loadSheetsData() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        parseCSVAndRender(data);
        document.getElementById('sync-time-text').innerText = '✅ 已即時同步 Google 試算表最新行程';
      } catch (error) {
        console.error('抓取試算表失敗:', error);
        document.getElementById('sync-time-text').innerText = '⚠️ 無法取得雲端試算表，顯示預設行程';
      }
    }

    function parseCSVAndRender(csvText) {
      const lines = csvText.split('\n');
      const container = document.getElementById('itinerary-container');
      container.innerHTML = ''; // 清空載入提示

      let currentCard = null;

      lines.forEach((line) => {
        const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (!cols[0] && !cols[1]) return;

        // 如果是標題列 (例如包含 Day 或日期)
        if (cols[0].includes('Day') || cols[0].includes('11/')) {
          currentCard = document.createElement('div');
          currentCard.className = 'card';
          currentCard.innerHTML = `
            <div class="day-title">
              <span>${cols[0]} ${cols[1] || ''}</span>
              <span class="tag tag-green">${cols[2] || '行程'}</span>
            </div>
          `;
          container.appendChild(currentCard);
        } else if (currentCard) {
          // 一般行程時間軸內容
          const item = document.createElement('div');
          item.className = 'timeline-item';
          item.innerHTML = `
            <div class="time">${cols[0]}</div>
            <div>${cols[1] || ''} ${cols[2] ? `<br><small style="color:#666;">💡 ${cols[2]}</small>` : ''}</div>
          `;
          currentCard.appendChild(item);
        }
      });
    }

    function switchTab(tabName) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));
      
      if (tabName === 'itinerary') {
        buttons[0].classList.add('active');
        document.getElementById('tab-itinerary').classList.add('active');
      } else if (tabName === 'checklist') {
        buttons[1].classList.add('active');
        document.getElementById('tab-checklist').classList.add('active');
      } else if (tabName === 'packing') {
        buttons[2].classList.add('active');
        document.getElementById('tab-packing').classList.add('active');
      }
    }

    function toggleDone(element, event) {
      if (event && event.target.tagName.toLowerCase() === 'input' && event.target.type === 'text') return;
      const checkbox = element.querySelector('input[type="checkbox"]');
      if (event && event.target !== checkbox) checkbox.checked = !checkbox.checked;
      if (checkbox.checked) element.classList.add('done');
      else element.classList.remove('done');
    }

    function addCustomItem() {
      const container = document.getElementById('custom-packing-container');
      const newItem = document.createElement('div');
      newItem.className = 'checklist-item';
      newItem.setAttribute('onclick', 'toggleDone(this, event)');
      newItem.innerHTML = `
        <input type="checkbox">
        <div style="flex:1;"><input type="text" class="custom-input" placeholder="點擊填寫新增物品..." onclick="event.stopPropagation()"></div>
      `;
      container.appendChild(newItem);
    }

    // 頁面載入時自動讀取雲端試算表
    window.onload = loadSheetsData;
  </script>
</body>
</html>
